<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c0392b">
<link rel="manifest" href="manifest.json">
<title>Słówka ES</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#1f1d1a;--muted:#6f6a62;--accent:#c0392b;--ok:#1e8449;--bad:#c0392b;--line:#e4ded3}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--card:#242120;--text:#f0ebe3;--muted:#a39d93;--accent:#e2574a;--ok:#4cc27a;--bad:#ff7b6e;--line:#38342f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
button,select,input{font:inherit;color:inherit}
button{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.active{border-color:var(--accent);color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button.small{min-height:36px;padding:0 10px;font-size:.85rem}
input[type=text],input[type=date],input[type=number],select{width:100%;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.hidden,.overlay.hidden{display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay .card{width:100%;max-width:520px;margin:0}
.word{font-size:1.7rem;font-weight:700;text-align:center;margin:18px 0;word-break:break-word}
.hint{color:var(--muted);font-size:.85rem;text-align:center}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.res{margin:12px 0;font-size:1.05rem}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.res small{display:block;color:var(--muted);font-size:.85rem}
ul.words{list-style:none;padding:0;margin:8px 0 0;max-height:50vh;overflow:auto}
ul.words li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
ul.words li span{flex:1;word-break:break-word}
.muted{color:var(--muted);font-size:.9rem}
.cal-head{align-items:center}.cal-head b{text-align:center;flex:3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}
.cal .dn{font-size:.75rem;color:var(--muted)}
.cal button{min-height:40px;padding:0;border-radius:10px;font-size:.9rem}
.cal button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.cal button.sel{box-shadow:0 0 0 2px var(--text) inset}
.cal button.today{text-decoration:underline}
.day{border-top:1px solid var(--line);padding:8px 0}
.day small{display:block;color:var(--muted)}
.big{font-size:1.4rem;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Słówka hiszpańskie <small class="muted">wersja 9</small></h1>
<div class="tabs">
  <button id="tabLearn" class="active">Nauka</button>
  <button id="tabBase">Baza (<span id="count">0</span>)</button>
  <button id="tabProg">Postępy</button>
</div>

<!-- NAUKA: ustawienia -->
<section id="setup">
  <div class="card">
    <label>Kierunek</label>
    <div class="row">
      <button id="dirPlEs" class="active">PL → ES</button>
      <button id="dirEsPl">ES → PL</button>
    </div>
    <label>Z jakiego okresu (kiedy dodane)</label>
    <select id="range">
      <option value="all">Cała baza</option>
      <option value="1">Dzisiaj</option>
      <option value="7">Ostatnie 7 dni</option>
      <option value="14">Ostatnie 14 dni</option>
      <option value="30">Ostatni miesiąc (30 dni)</option>
      <option value="custom">Własny zakres dat…</option>
    </select>
    <div id="customRange" class="row hidden" style="margin-top:8px">
      <div><label>Od</label><input type="date" id="dFrom"></div>
      <div><label>Do</label><input type="date" id="dTo"></div>
    </div>
    <p class="muted" id="poolInfo"></p>
    <label>Liczba słówek w cyklu</label>
    <div class="row">
      <input type="number" id="size" min="1" inputmode="numeric" value="10">
      <button id="sizeAll" style="flex:0 0 auto">Wszystkie</button>
    </div>
    <p class="muted" id="setupMsg"></p>
    <button class="primary" id="start" style="width:100%">Start</button>
  </div>
</section>

<!-- NAUKA: karta -->
<section id="quiz" class="hidden">
  <div class="bar"><i id="bar"></i></div>
  <div class="card">
    <div class="hint" id="qLabel"></div>
    <div class="word" id="qWord"></div>
    <input type="text" id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Wpisz tłumaczenie (słowo lub całe wyrażenie)">
    <div id="result" class="res"></div>
    <button class="primary" id="go" style="width:100%">Sprawdź</button>
    <div class="row" style="margin-top:10px">
      <button id="qEdit" class="small">Edytuj</button>
      <button id="qForget" class="small danger">Zapomnij</button>
      <button id="quit" class="small">Zakończ cykl</button>
    </div>
  </div>
</section>

<!-- NAUKA: podsumowanie -->
<section id="summary" class="hidden">
  <div class="card">
    <h1>Koniec cyklu</h1>
    <p id="sumText"></p>
    <div id="sumHard"></div>
    <button class="primary" id="again" style="width:100%;margin-top:10px">Kolejny cykl</button>
  </div>
</section>

<!-- BAZA -->
<section id="base" class="hidden">
  <div class="card">
    <label>Wczytaj slowka.txt</label>
    <input type="file" id="file" accept=".txt,text/plain">
    <div class="row" style="margin-top:12px">
      <button id="download">Pobierz slowka.txt</button>
    </div>
    <p class="muted" id="baseMsg"></p>
  </div>
  <div class="card">
    <label>Dodaj słówko lub wyrażenie</label>
    <input type="text" id="addEs" placeholder="Hiszpański (np. abrir el grifo)" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div style="height:8px"></div>
    <input type="text" id="addPl" placeholder="Polski (np. odkręcić kran)" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="primary" id="add" style="width:100%;margin-top:10px">Dodaj</button>
  </div>
  <div class="card">
    <input type="text" id="filter" placeholder="Szukaj w bazie…" autocapitalize="off" spellcheck="false">
    <ul class="words" id="list"></ul>
  </div>
</section>

<!-- POSTĘPY: kalendarz + podsumowanie -->
<section id="progress" class="hidden">
  <div class="card">
    <div class="row cal-head">
      <button id="calPrev" class="small">‹</button>
      <b id="calTitle"></b>
      <button id="calNext" class="small">›</button>
    </div>
    <div class="cal" id="cal"></div>
    <p class="muted">Podświetlone dni = dni nauki. Kliknij dzień, żeby zobaczyć jego podsumowanie.</p>
  </div>
  <div class="card">
    <label>Zakres podsumowania</label>
    <div class="row">
      <div><label>Od</label><input type="date" id="sFrom"></div>
      <div><label>Do</label><input type="date" id="sTo"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="small" data-r="1">Dziś</button>
      <button class="small" data-r="7">7 dni</button>
      <button class="small" data-r="30">30 dni</button>
      <button class="small" data-r="all">Wszystko</button>
    </div>
    <div id="statOut" style="margin-top:12px"></div>
  </div>
</section>
</main>

<!-- EDYCJA SŁÓWKA (z nauki i z bazy) -->
<div id="editBox" class="overlay hidden">
  <div class="card">
    <label>Polski</label>
    <input type="text" id="ePl" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label>Hiszpański</label>
    <input type="text" id="eEs" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="muted" id="eMsg"></p>
    <div class="row">
      <button id="eCancel">Anuluj</button>
      <button id="eSave" class="primary">Zapisz</button>
    </div>
  </div>
</div>

<script>
const KEY='slowka_es_v1';
const $=id=>document.getElementById(id);
let words=[];           // {pl:[..], es:[..]}
let dir='pl2es';
let S=null;             // sesja nauki

// ---------- baza ----------
// dzieli odpowiedniki znakiem / (ale nie wewnątrz nawiasów)
function splitAlt(s){
  const out=[];let d=0,cur='';
  for(const ch of s){
    if(ch==='(') d++; else if(ch===')') d=Math.max(0,d-1);
    if(ch==='/'&&d===0){out.push(cur);cur=''} else cur+=ch;
  }
  out.push(cur);
  return out.map(x=>x.trim()).filter(Boolean);
}
const today=()=>new Date().toLocaleDateString('sv');
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s);
// linia: polski;hiszpański[;RRRR-MM-DD] — brak daty => def
function parse(text,def){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();
    if(!line||line.startsWith('#')) continue;
    const p=line.split(';');if(p.length<2) continue;
    let date=def||null;
    if(p.length>=3&&isDate(p[p.length-1].trim())) date=p.pop().trim();
    const pl=splitAlt(p[0]);
    const es=splitAlt(p.slice(1).join(';'));
    if(pl.length&&es.length) out.push({pl,es,date});
  }
  return out;
}
const keyOf=w=>w.pl.join('/')+';'+w.es.join('/');
const fmt=w=>keyOf(w)+(w.date?';'+w.date:'');
function serialize(){return '# Format: polski;hiszpański;data dodania RRRR-MM-DD   (kilka odpowiedników rozdzielaj znakiem /, data jest opcjonalna)\n'+words.map(fmt).join('\n')+'\n'}
// historia sesji (kalendarz, podsumowania) i statystyki słówek (ile razy, ile błędów) — osobno od bazy
const HKEY='slowka_hist_v1',SKEY='slowka_stats_v1';
const MKEY='slowka_meta_v1';
let hist=[],stats={},meta={sess:0}; // meta.sess = licznik rozpoczętych sesji
function save(){
  try{localStorage.setItem(KEY,serialize())}catch(e){}
  try{localStorage.setItem(HKEY,JSON.stringify(hist));localStorage.setItem(SKEY,JSON.stringify(stats));localStorage.setItem(MKEY,JSON.stringify(meta))}catch(e){}
}
// zapis z opóźnieniem — seria zmian = jeden zapis; na wyjściu zapisujemy od razu
let st=null;
function saveSoon(){clearTimeout(st);st=setTimeout(()=>{st=null;save()},300)}
function flush(){if(st){clearTimeout(st);st=null;save()}}
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
// indeks do szybkiego sprawdzania duplikatów; przy wczytaniu usuwa też powtórzenia
let keys=new Set();
function reindex(){keys=new Set();words=words.filter(w=>{const k=keyOf(w);if(keys.has(k))return false;keys.add(k);return true})}
function load(){
  try{const t=localStorage.getItem(KEY);if(t){words=parse(t,today());reindex()}}catch(e){}
  try{hist=JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){hist=[]}
  try{stats=JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){stats={}}
  try{meta=JSON.parse(localStorage.getItem(MKEY))||{sess:hist.length}}catch(e){meta={sess:hist.length}}
}

// ---------- zakres dat ----------
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv')}
function pool(){
  const r=$('range').value;
  if(r==='all') return words;
  let from,to='9999-12-31';
  if(r==='custom'){from=$('dFrom').value||'0000-01-01';to=$('dTo').value||to}
  else from=addDays(-(+r-1));
  return words.filter(w=>w.date&&w.date>=from&&w.date<=to);
}
function updateSetup(){
  $('customRange').classList.toggle('hidden',$('range').value!=='custom');
  const p=pool(),g=groups(p,meta.sess+1);
  $('poolInfo').textContent='Pasuje słówek: '+p.length+' (z '+words.length+' w bazie) — nowe: '+g.new.length+', trudne gotowe do powtórki: '+g.hard.length+', trudne czekające: '+g.wait.length+', umiem: '+g.known.length+', były już dziś: '+g.today.length;
}

// ---------- ocena ----------
const strip=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l').replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
const lc=s=>s.toLowerCase().replace(/\s+/g,' ').trim();
// W odpowiedzi hiszpańskiej rodzajniki (określone i nieokreślone) są ignorowane po obu stronach:
// można je pominąć, dopisać lub podmienić (la/el/una...) — liczy się reszta zdania. "lo" celowo pominięte (lo siento).
// Tekst w nawiasach to notatka: można go pominąć (lub wpisać bez nawiasów).
const ARTS=new Set(['el','la','los','las','un','una','unos','unas']);
const noPar=t=>t.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
const unPar=t=>t.replace(/[()]/g,'').replace(/\s+/g,' ').trim();
function judge(input,targets,lang){
  const es=lang==='es';
  const A=lc(input).split(' '),B=strip(input).split(' ').filter(Boolean);
  const same=(x,y)=>x.length===y.length&&x.every((w,i)=>w===y[i]);
  const noArt=ts=>{const r=ts.filter(w=>!ARTS.has(strip(w)));return r.length?r:ts};
  const norm=ts=>es?noArt(ts):ts;
  const cands=[];
  for(const orig of targets) for(const t of new Set([orig,noPar(orig),unPar(orig)])) if(t) cands.push([t,orig]);
  for(const [t,o] of cands)
    if(same(A,lc(t).split(' '))) return t===o?{ok:true,exact:true}:{ok:true,exact:false,full:o};
  for(const [t,o] of cands)
    if(same(norm(A),norm(lc(t).split(' ')))) return {ok:true,exact:false,full:o};
  for(const [t,o] of cands)
    if(same(norm(B),norm(strip(t).split(' ').filter(Boolean)))) return {ok:true,exact:false,full:o};
  return {ok:false};
}

// ---------- sesja ----------
// po ilu kartach wraca błędne słówko — zależy od wielkości cyklu
const gapsFor=n=>n<=10?[3,5,8]:n<=20?[5,10,15]:[10,15,20];
const IDLE_MAX=120000; // przerwa dłuższa niż 2 min nie liczy się do czasu nauki
// ---------- wybór słówek do sesji ----------
// nowe = jeszcze nie padło; trudne = ostatnio błąd / "nie wiem"; umiem = ostatnio dobrze za 1. razem.
// Trudne wraca dopiero po kilku sesjach (pierwsze błędne w sesji po 3 sesjach przerwy, kolejne o 1 sesję później)
// i nigdy tego samego dnia, w którym był błąd.
const HARD_SKIP=3;
const legacyHard=s=>s.b!=null?s.b===0:s.err>0; // słówka ocenione jeszcze w wersji z pudełkami
const isHard=s=>s.hard!=null?s.hard:legacyHard(s);
function kind(w,k,td){
  const s=stats[keyOf(w)];
  if(!s||!s.n) return 'new';
  if(!isHard(s)) return 'known';
  return (s.dueSess||0)<=k&&(s.missDay||s.last||'')<td?'hard':'wait';
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// słówka, które dziś już były w jakiejś sesji, trafiają do grupy "today" i nie wchodzą do kolejnych sesji tego dnia
function groups(p,k){
  const td=today(),g={new:[],hard:[],known:[],wait:[],today:[]};
  for(const w of p){const s=stats[keyOf(w)];g[s&&s.last===td?'today':kind(w,k,td)].push(w)}
  return g;
}
// skład: trudne (do 1 przy sesji do 20, do 3 powyżej), 1 znane, reszta nowe; kolejność w sesji wymieszana.
// Gdy brakuje nowych: najpierw znane, których nie było od min. 3 dni (najdawniejsze pierwsze),
// potem dodatkowe trudne — łącznie najwyżej 1/4 sesji.
function pickCards(p,n,k){
  const g=groups(p,k),st=w=>stats[keyOf(w)]||{};
  const hardAll=shuffle(g.hard).sort((a,b)=>(st(a).dueSess||0)-(st(b).dueSess||0));
  const knownAll=shuffle(g.known).sort((a,b)=>(st(a).last||'')<(st(b).last||'')?-1:(st(a).last||'')>(st(b).last||'')?1:0);
  const hard=hardAll.slice(0,Math.min(n<=20?1:3,n));
  const known=knownAll.slice(0,Math.min(1,n-hard.length));
  let out=shuffle(g.new).slice(0,n-hard.length-known.length).concat(hard,known);
  if(out.length<n){
    const old=addDays(-3);
    out=out.concat(knownAll.slice(known.length).filter(w=>(st(w).last||'')<=old).slice(0,n-out.length));
    const hardLimit=Math.max(hard.length,Math.floor(n/4));
    out=out.concat(hardAll.slice(hard.length,hardLimit).slice(0,n-out.length));
  }
  return shuffle(out);
}
function startSession(){
  const p=pool();
  if(!p.length){$('setupMsg').textContent=words.length?'Brak słówek w wybranym okresie.':'Baza jest pusta — dodaj słówka w zakładce Baza.';return}
  $('setupMsg').textContent='';
  const want=Math.floor(+$('size').value);
  const n=want>=1?Math.min(want,p.length):p.length;
  const pick=pickCards(p,n,meta.sess+1);
  if(!pick.length){$('setupMsg').textContent='Brak słówek do nauki teraz — dodaj nowe słówka w zakładce Baza albo wróć jutro.';return}
  if(pick.length<n&&!confirm('Brakuje słówek — ta sesja będzie miała '+pick.length+' (zamiast '+n+'). Warto dodać nowe słówka w zakładce Baza. Zacząć?')) return;
  meta.sess++;
  S={queue:pick.map(w=>({w,phase:'new',errors:0})),total:pick.length,done:0,cards:[],cur:null,checked:false,
     gaps:gapsFor(pick.length),dir,start:Date.now(),last:Date.now(),active:0,k:meta.sess,miss:0};
  saveSoon();
  S.cards=S.queue.slice();
  show('quiz');nextCard();
}
const prompts=c=>dir==='pl2es'?c.w.pl:c.w.es;
const targets=c=>dir==='pl2es'?c.w.es:c.w.pl;
function nextCard(){
  if(!S.queue.length) return finish();
  S.cur=S.queue.shift();S.checked=false;
  $('qLabel').textContent=dir==='pl2es'?'Po polsku → wpisz po hiszpańsku':'Po hiszpańsku → wpisz po polsku';
  $('qWord').textContent=prompts(S.cur).join(' / ');
  $('answer').value='';$('answer').disabled=false;
  $('result').className='res';$('result').innerHTML='';
  goLabel();
  $('bar').style.width=(S.done/S.total*100)+'%';
  $('answer').focus();
}
// pusta odpowiedź = "nie wiem": pokazuje wzór i liczy się jak błąd
function goLabel(){if(S&&!S.checked) $('go').textContent='Sprawdź'}
function reinsert(c,gap){S.queue.splice(Math.min(gap,S.queue.length),0,c)}
function check(){
  const c=S.cur,val=$('answer').value;
  const r=val.trim()?judge(val,targets(c),dir==='pl2es'?'es':'pl'):{ok:false};
  const now=Date.now();S.active+=Math.min(now-S.last,IDLE_MAX);S.last=now;
  const s=stats[keyOf(c.w)]||(stats[keyOf(c.w)]={n:0,ok:0,err:0});
  if(!c.seen){c.seen=true;s.n++;if(r.ok){s.ok++;s.hard=false}}
  if(!r.ok){
    s.err++;
    if(!c.missed){c.missed=true;s.hard=true;s.missDay=today();s.dueSess=S.k+HARD_SKIP+1+S.miss++}
  }
  s.last=today();saveSoon();
  const all=targets(c).join(' / ');
  const res=$('result');
  if(r.ok){
    res.className='res ok';
    res.innerHTML='✓ Dobrze'+(r.exact?'':'<small>Pełna forma: '+esc(r.full)+'</small>')+(targets(c).length>1?'<small>Wszystkie odpowiedniki: '+esc(all)+'</small>':'');
    S.done++;c.done=true;
  }else{
    c.errors++;c.phase='retry';c.everWrong=true;
    res.className='res bad';
    res.innerHTML='✗ Poprawnie: <b>'+esc(all)+'</b>'+(val.trim()?'<small>Twoja odpowiedź: '+esc(val.trim())+'</small>':'<small>Słówko wróci do powtórki.</small>');
    reinsert(c,S.gaps[Math.min(c.errors-1,S.gaps.length-1)]);
  }
  $('answer').disabled=true;S.checked=true;$('go').textContent='Dalej';$('go').focus();
  $('bar').style.width=(S.done/S.total*100)+'%';
}
function finish(){
  const hard=S.cards.filter(c=>c.everWrong);
  const rec=recordSession();
  $('sumText').innerHTML=rec?'Poprawnie za pierwszym razem: <span class="big">'+score(rec.ok,rec.n)+'</span><br><span class="muted">Czas nauki: '+fmtMin(rec.sec)+'</span>':'Brak odpowiedzi w tym cyklu.';
  $('sumHard').innerHTML=hard.length?'<b>Do powtórki:</b><ul>'+hard.map(c=>'<li>'+esc(c.w.pl.join('/'))+' = '+esc(c.w.es.join('/'))+' ('+c.errors+'× błąd)</li>').join('')+'</ul>':'<p class="muted">Wszystko poprawnie. 🎉</p>';
  S=null;
  if(!$('quiz').classList.contains('hidden')) show('summary');
}
// zapis zakończonej (lub przerwanej) sesji do historii; liczą się karty, na które padła odpowiedź
function recordSession(){
  if(!S||S.recorded) return null;
  S.recorded=true;
  const tried=S.cards.filter(c=>c.seen);
  if(!tried.length) return null;
  const rec={d:new Date(S.start).toLocaleDateString('sv'),t:S.start,sec:Math.round(S.active/1000),
             ok:tried.filter(c=>c.done&&!c.everWrong).length,n:tried.length,dir:S.dir};
  hist.push(rec);saveSoon();
  return rec;
}
const pct=(ok,n)=>n?Math.round(ok/n*100):0;
const score=(ok,n)=>ok+'/'+n+' ('+pct(ok,n)+'%)';
const fmtMin=sec=>sec>0&&sec<60?'<1 min':Math.round(sec/60)+' min';
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
$('go').onclick=()=>S.checked?nextCard():check();
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('go').onclick()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&S&&S.checked&&document.activeElement!==$('go')&&document.activeElement.tagName!=='INPUT'&&$('editBox').classList.contains('hidden')&&$('quiz').offsetParent){$('go').onclick()}});
$('quit').onclick=()=>{if(S&&confirm('Zakończyć cykl?')){recordSession();S=null;show('setup')}};
$('start').onclick=startSession;
$('again').onclick=()=>show('setup');

// ---------- widoki ----------
function show(id){
  for(const s of ['setup','quiz','summary','base','progress']) $(s).classList.toggle('hidden',s!==id);
  $('tabLearn').classList.toggle('active',id!=='base'&&id!=='progress');
  $('tabBase').classList.toggle('active',id==='base');
  $('tabProg').classList.toggle('active',id==='progress');
  if(id==='base') renderList();
  if(id==='setup') updateSetup();
  if(id==='progress') renderProgress();
}
$('tabProg').onclick=()=>show('progress');

// ---------- postępy: kalendarz + podsumowanie zakresu ----------
let calMonth=new Date();calMonth.setDate(1);
const MONTHS=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
function renderCalendar(){
  const days=new Set(hist.map(h=>h.d));
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  $('calTitle').textContent=MONTHS[m]+' '+y;
  const from=$('sFrom').value,to=$('sTo').value,td=today();
  const cal=$('cal');cal.innerHTML='';
  for(const n of ['pn','wt','śr','cz','pt','sb','nd']){const d=document.createElement('div');d.className='dn';d.textContent=n;cal.appendChild(d)}
  const lead=(new Date(y,m,1).getDay()+6)%7;
  for(let i=0;i<lead;i++) cal.appendChild(document.createElement('div'));
  const last=new Date(y,m+1,0).getDate();
  for(let d=1;d<=last;d++){
    const ds=new Date(y,m,d).toLocaleDateString('sv');
    const b=document.createElement('button');b.textContent=d;
    if(days.has(ds)) b.classList.add('on');
    if(from&&to&&ds>=from&&ds<=to) b.classList.add('sel');
    if(ds===td) b.classList.add('today');
    b.onclick=()=>{$('sFrom').value=ds;$('sTo').value=ds;renderProgress()};
    cal.appendChild(b);
  }
}
function renderStats(){
  const from=$('sFrom').value||'0000-01-01',to=$('sTo').value||'9999-12-31';
  const list=hist.filter(h=>h.d>=from&&h.d<=to);
  const out=$('statOut');
  if(!list.length){out.innerHTML='<p class="muted">Brak sesji w tym zakresie.</p>';return}
  const sum=(a,k)=>a.reduce((s,h)=>s+h[k],0);
  const byDay={};for(const h of list)(byDay[h.d]=byDay[h.d]||[]).push(h);
  const dayKeys=Object.keys(byDay).sort().reverse();
  let html='<div class="big">'+score(sum(list,'ok'),sum(list,'n'))+'</div>'+
    '<p class="muted">Dni nauki: '+dayKeys.length+' · sesje: '+list.length+' · czas: '+fmtMin(sum(list,'sec'))+'</p>';
  for(const d of dayKeys){
    const a=byDay[d];
    html+='<div class="day"><b>'+d+'</b> — '+score(sum(a,'ok'),sum(a,'n'))+' · '+a.length+' '+sesje(a.length)+' · '+fmtMin(sum(a,'sec'));
    for(const h of a.slice().sort((x,y)=>x.t-y.t))
      html+='<small>'+new Date(h.t).toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'})+' · '+(h.dir==='pl2es'?'PL→ES':'ES→PL')+' · '+score(h.ok,h.n)+' · '+fmtMin(h.sec)+'</small>';
    html+='</div>';
  }
  out.innerHTML=html;
}
const sesje=n=>n===1?'sesja':(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?'sesje':'sesji';
function renderProgress(){renderCalendar();renderStats()}
function setStatRange(r){
  if(r==='all'){$('sFrom').value='';$('sTo').value=''}
  else{$('sFrom').value=addDays(-(+r-1));$('sTo').value=today()}
  renderProgress();
}
document.querySelectorAll('#progress [data-r]').forEach(b=>b.onclick=()=>setStatRange(b.dataset.r));
$('sFrom').onchange=$('sTo').onchange=renderProgress;
$('calPrev').onclick=()=>{calMonth.setMonth(calMonth.getMonth()-1);renderCalendar()};
$('calNext').onclick=()=>{calMonth.setMonth(calMonth.getMonth()+1);renderCalendar()};
$('range').onchange=$('dFrom').onchange=$('dTo').onchange=updateSetup;
$('sizeAll').onclick=()=>{$('size').value=Math.max(pool().length,1)};
$('tabLearn').onclick=()=>show(S?'quiz':'setup');
$('tabBase').onclick=()=>show('base');
function setDir(d){dir=d;$('dirPlEs').classList.toggle('active',d==='pl2es');$('dirEsPl').classList.toggle('active',d==='es2pl')}
$('dirPlEs').onclick=()=>setDir('pl2es');
$('dirEsPl').onclick=()=>setDir('es2pl');

// ---------- zmiany w bazie (z nauki i z zakładki Baza) ----------
// sesja trzyma te same obiekty słówek co baza, więc edycja widoczna jest od razu w nauce
function changed(){
  saveSoon();updateSetup();
  $('count').textContent=words.length;
  if(!$('base').classList.contains('hidden')) renderList();
  if(S&&S.cur) $('qWord').textContent=prompts(S.cur).join(' / ');
  if(S&&S.total) $('bar').style.width=(S.done/S.total*100)+'%';
}
function removeWord(w){
  const i=words.indexOf(w);if(i>=0) words.splice(i,1);
  keys.delete(keyOf(w));delete stats[keyOf(w)];
  const c=S&&S.cards.find(x=>x.w===w);
  if(c){
    S.cards=S.cards.filter(x=>x!==c);S.queue=S.queue.filter(x=>x!==c);
    if(c.done) S.done--;
    S.total=S.cards.length;
    if(S.cur===c){S.cur=null;changed();nextCard();return}
  }
  changed();
}
function forget(w){if(confirm('Usunąć „'+w.pl.join('/')+' = '+w.es.join('/')+'” z bazy?')) removeWord(w)}
let editTarget=null;
function openEdit(w){
  editTarget=w;$('ePl').value=w.pl.join('/');$('eEs').value=w.es.join('/');$('eMsg').textContent='';
  $('editBox').classList.remove('hidden');$('ePl').focus();
}
function closeEdit(){$('editBox').classList.add('hidden');editTarget=null}
function saveEdit(){
  const w=editTarget;if(!w) return;
  const pl=splitAlt($('ePl').value),es=splitAlt($('eEs').value);
  if(!pl.length||!es.length){$('eMsg').textContent='Wypełnij oba pola.';return}
  const old=keyOf(w),nk=pl.join('/')+';'+es.join('/');
  if(nk!==old&&keys.has(nk)){$('eMsg').textContent='Takie słówko już jest w bazie.';return}
  keys.delete(old);keys.add(nk);w.pl=pl;w.es=es;delete w._s;
  if(nk!==old&&stats[old]){stats[nk]=stats[old];delete stats[old]}
  closeEdit();changed();
}
$('eSave').onclick=saveEdit;$('eCancel').onclick=closeEdit;
$('editBox').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveEdit()}else if(e.key==='Escape') closeEdit()});
$('qEdit').onclick=()=>{if(S&&S.cur) openEdit(S.cur.w)};
$('qForget').onclick=()=>{if(S&&S.cur) forget(S.cur.w)};

// ---------- zarządzanie bazą ----------
// lista pokazuje porcjami (PAGE), a tekst do szukania liczony jest raz na słówko
const PAGE=50;let shown=PAGE;
const KIND_LABEL={new:'nowe',hard:'trudne',wait:'trudne (wróci później)',known:'umiem'};
const sx=w=>w._s||(w._s=strip(w.pl.join('/')+' '+w.es.join('/')));
function renderList(){
  $('count').textContent=words.length;
  const f=strip($('filter').value);
  const found=f?words.filter(w=>sx(w).includes(f)):words;
  const ul=$('list'),frag=document.createDocumentFragment();
  found.slice(0,shown).forEach(w=>{
    const t=w.pl.join('/')+' = '+w.es.join('/');
    const li=document.createElement('li');
    li.innerHTML='<span>'+esc(t)+' <small class="muted">'+(w.date?w.date+' · ':'')+KIND_LABEL[kind(w,meta.sess+1,today())]+'</small>'+'</span>';
    const e=document.createElement('button');e.className='small';e.textContent='Edytuj';
    e.onclick=()=>openEdit(w);
    const b=document.createElement('button');b.className='small danger';b.textContent='Zapomnij';
    b.onclick=()=>forget(w);
    li.append(e,b);frag.appendChild(li);
  });
  ul.replaceChildren(frag);
  if(!found.length) ul.innerHTML='<li class="muted">Brak słówek.</li>';
  else if(found.length>shown){
    const li=document.createElement('li');
    li.innerHTML='<span class="muted">Pokazano '+shown+' z '+found.length+'</span>';
    const b=document.createElement('button');b.className='small';b.textContent='Pokaż więcej';
    b.onclick=()=>{shown+=PAGE;renderList()};
    li.appendChild(b);ul.appendChild(li);
  }
}
let ft;$('filter').oninput=()=>{clearTimeout(ft);ft=setTimeout(()=>{shown=PAGE;renderList()},200)};
$('add').onclick=()=>{
  const w=parse($('addPl').value.trim()+';'+$('addEs').value.trim(),today())[0];
  if(!w){$('baseMsg').textContent='Wpisz słówko po obu stronach.';return}
  if(keys.has(keyOf(w))){$('baseMsg').textContent='Takie słówko już jest.';return}
  words.push(w);keys.add(keyOf(w));changed();
  $('addPl').value='';$('addEs').value='';$('addEs').focus();
  $('baseMsg').textContent='Dodano. Pamiętaj pobrać slowka.txt, żeby zachować zmiany w pliku.';
};
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const w=parse(String(r.result),null);
    if(!w.length){$('baseMsg').textContent='Nie znaleziono poprawnych linii w pliku.';return}
    const known=new Map(words.map(x=>[keyOf(x),x.date]));
    w.forEach(x=>{if(!x.date) x.date=known.get(keyOf(x))||today()});
    if(words.length&&!confirm('Wczytanie zastąpi obecną bazę ('+words.length+' słówek) plikiem ('+w.length+'). Kontynuować?')) return;
    const hadCycle=!!S;
    words=w;reindex();shown=PAGE;S=null;changed();$('baseMsg').textContent='Wczytano '+w.length+' słówek.'+(hadCycle?' Trwający cykl nauki został zakończony.':'');
  };
  r.readAsText(f,'utf-8');e.target.value='';
};
$('download').onclick=()=>{
  const url=URL.createObjectURL(new Blob([serialize()],{type:'text/plain;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='slowka.txt';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

// ---------- start ----------
load();
$('count').textContent=words.length;
updateSetup();
$('sFrom').value=addDays(-6);$('sTo').value=today();
if(!words.length){$('setupMsg').textContent='Baza jest pusta — wczytaj slowka.txt w zakładce Baza.'}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
